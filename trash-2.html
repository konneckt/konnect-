<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Review Summary</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  body { background: #f5f5f5; padding: 20px; }

  .review-summary { 
    background: white; 
    padding: 20px; 
    border-radius: 16px; 
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    max-width: 400px;
  }
  
  /* TOP PART */
  .review-header { 
    display: flex; 
    align-items: center; 
    gap: 16px; 
    margin-bottom: 16px; 
    padding-bottom: 16px;
    border-bottom: 1px solid #eee;
  }
  .avg-score { 
    font-size: 48px; 
    font-weight: 800; 
    line-height: 1;
    color: #111;
  }
  .stars { 
    color: #FFB400; 
    font-size: 18px; 
    margin-bottom: 4px;
  }
  .total-reviews { 
    font-size: 13px; 
    color: #666; 
  }

  /* RATING BARS */
  .rating-bar { 
    display: flex; 
    align-items: center; 
    gap: 10px; 
    margin: 8px 0; 
    font-size: 13px;
    color: #444;
  }
  .rating-label { 
    width: 40px; 
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .bar-bg { 
    flex: 1; 
    height: 8px; 
    background: #f0f0f0; 
    border-radius: 10px; 
    overflow: hidden; 
  }
  .bar-fill { 
    height: 100%; 
    background: #FFB400; 
    border-radius: 10px; 
    width: 0%; /* JS will set this */
  }
  .rating-count { 
    width: 30px; 
    text-align: right; 
    color: #666; 
  }
</style>
</head>
<body>

<div class="review-summary">
  <!-- HEADER -->
  <div class="review-header">
    <div class="avg-score">4.6</div> <!-- JS will update this -->
    <div>
      <div class="stars">★★★★☆</div> <!-- JS will update this -->
      <div class="total-reviews">128 reviews</div> <!-- JS will update this -->
    </div>
  </div>

  <!-- RATING BREAKDOWN BARS -->
  <div class="rating-bar">
    <span class="rating-label">5 <i data-lucide="star" size="12"></i></span>
    <div class="bar-bg"><div class="bar-fill" style="width:70%"></div></div> <!-- JS sets % -->
    <span class="rating-count">90</span> <!-- JS sets count -->
  </div>

  <div class="rating-bar">
    <span class="rating-label">4 <i data-lucide="star" size="12"></i></span>
    <div class="bar-bg"><div class="bar-fill" style="width:20%"></div></div>
    <span class="rating-count">25</span>
  </div>

  <div class="rating-bar">
    <span class="rating-label">3 <i data-lucide="star" size="12"></i></span>
    <div class="bar-bg"><div class="bar-fill" style="width:7%"></div></div>
    <span class="rating-count">9</span>
  </div>

  <div class="rating-bar">
    <span class="rating-label">2 <i data-lucide="star" size="12"></i></span>
    <div class="bar-bg"><div class="bar-fill" style="width:2%"></div></div>
    <span class="rating-count">3</span>
  </div>

  <div class="rating-bar">
    <span class="rating-label">1 <i data-lucide="star" size="12"></i></span>
    <div class="bar-bg"><div class="bar-fill" style="width:1%"></div></div>
    <span class="rating-count">1</span>
  </div>
</div>

<script>lucide.createIcons();</script>
</body>
</html>

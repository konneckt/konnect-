<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HITS</title>
<style>
  :root { --teal: #00F5D4; --pink: #FF0054; --bg: #000; --card: #111; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
  body { background: var(--bg); color: #fff; padding-bottom: 70px; }

  /* TABS */
  .tabs {
    display: flex; position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px);
    border-bottom: 1px solid #222; z-index: 10;
  }
  .tab {
    flex: 1; padding: 16px; text-align: center; font-weight: 800; cursor: pointer; opacity: 0.5;
    border-bottom: 3px solid transparent;
  }
  .tab.active { opacity: 1; color: var(--teal); border-bottom: 3px solid var(--teal); }

  .page { display: none; }
  .page.active { display: block; }

  /* COMMUNITY POSTS */
  .post {
    background: var(--card); border-bottom: 1px solid #222; padding: 16px;
    animation: fadeIn 0.5s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .post-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post-header img { width: 40px; height: 40px; border-radius: 50%; }
  .post-header b { font-size: 14px; }
  .post-header span { font-size: 12px; opacity: 0.6; }
  .post-img { width: 100%; border-radius: 12px; margin: 10px 0; }
  .post-actions { display: flex; gap: 20px; font-size: 14px; opacity: 0.7; }

  /* MEET PEOPLE - SAME AS BEFORE */
  .scan-area { padding: 25px 20px; text-align: center; }
  #scanBtn { background: linear-gradient(90deg, var(--teal), #00A3FF); color: #000; border: none; padding: 16px 35px; border-radius: 50px; font-size: 17px; font-weight: 900; width: 90%; max-width: 350px; }
  .radar-wrap { height: 280px; display: none; align-items: center; justify-content: center; flex-direction: column; }
  .radar { width: 240px; height: 240px; border-radius: 50%; position: relative; }
  .radar-ring { position: absolute; border: 1px solid rgba(0,245,212,0.2); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: pulse 2s infinite; }
  .r1 { width: 80px; height: 80px; } .r2 { width: 150px; height: 150px; animation-delay: 0.4s; } .r3 { width: 240px; height: 240px; animation-delay: 0.8s; }
  .radar-sweep { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(from 0deg, transparent 0%, var(--teal) 15%, transparent 30%); animation: sweep 2.5s linear infinite; mask: radial-gradient(circle, transparent 48%, black 49%); }
  @keyframes sweep { to { transform: rotate(360deg); } } @keyframes pulse { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.3); } }
  
  .section { padding: 0 16px 20px; }
  .section-title { font-size: 16px; font-weight: 800; margin: 15px 0 10px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; background: var(--teal); border-radius: 50%; animation: blink 1.5s infinite; }
  .person { background: var(--card); border: 1px solid #222; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .person img { width: 50px; height: 50px; border-radius: 50%; }
  .connect-btn { background: var(--teal); color: #000; border: none; padding: 8px 14px; border-radius: 18px; font-weight: 800; font-size: 12px; margin-left: auto; }

  /* CHAT MODAL */
  .chat-modal {
    position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 20;
    animation: slideUp 0.3s;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .chat-header { padding: 16px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; }
  .chat-header img { width: 40px; height: 40px; border-radius: 50%; }
  .chat-body { flex: 1; padding: 16px; overflow-y: auto; }
  .msg { background: var(--card); padding: 10px 14px; border-radius: 18px; margin-bottom: 8px; max-width: 80%; }
  .msg.me { background: var(--teal); color: #000; margin-left: auto; }
  .chat-input { display: flex; padding: 12px; border-top: 1px solid #222; gap: 10px; }
  .chat-input input { flex: 1; background: #222; border: none; border-radius: 20px; padding: 10px 15px; color: #fff; }
  .chat-input button { background: var(--teal); color: #000; border: none; border-radius: 50%; width: 40px; height: 40px; font-weight: 900; }
</style>
</head>
<body>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('community')">Community</div>
  <div class="tab" onclick="switchTab('meet')">Meet People</div>
</div>

<!-- PAGE 1: COMMUNITY POSTS -->
<div class="page active" id="community">
  <div class="post">
    <div class="post-header">
      <img src="https://i.pravatar.cc/40?u=a">
      <div><b>Aisha</b> <span>• 10min ago • 📍 Landmark</span></div>
    </div>
    <p>Who's trying to pull up to the DJ tonight? 🔥</p>
    <img class="post-img" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500">
    <div class="post-actions">🔥 24 Pull Ups  💬 5 Comments</div>
  </div>
  
  <div class="post">
    <div class="post-header">
      <img src="https://i.pravatar.cc/40?u=t">
      <div><b>Tolu</b> <span>• 1h ago • 📍 Landmark</span></div>
    </div>
    <p>Table for 4 available. Come link</p>
    <div class="post-actions">🔥 12 Pull Ups  💬 2 Comments</div>
  </div>
</div>

<!-- PAGE 2: MEET PEOPLE -->
<div class="page" id="meet">
  <div class="scan-area">
    <button id="scanBtn" onclick="fakeScan()">SCAN FOR PEOPLE NEARBY</button>
  </div>
  <div class="radar-wrap" id="radarWrap">
    <div class="radar"><div class="radar-ring r1"></div><div class="radar-ring r2"></div><div class="radar-ring r3"></div><div class="radar-sweep"></div></div>
    <p>SCANNING 500M...</p>
  </div>
  <div class="section" id="nearbySection" style="display:none;">
    <h2 class="section-title"><span class="dot"></span>NEARBY NOW</h2>
    <div id="nearbyList"></div>
  </div>
  <div class="section">
    <h2 class="section-title"><span class="dot" style="background:var(--pink)"></span>ONLINE NOW</h2>
    <div id="onlineList"></div>
  </div>
</div>

<!-- CHAT MODAL -->
<div class="chat-modal" id="chatModal">
  <div class="chat-header">
    <button onclick="closeChat()" style="background:none;border:none;color:#fff;font-size:20px;">←</button>
    <img id="chatImg" src="">
    <b id="chatName">Aisha</b>
  </div>
  <div class="chat-body" id="chatBody">
    <div class="msg">Hey! You down to link at Landmark?</div>
  </div>
  <div class="chat-input">
    <input type="text" id="chatInput" placeholder="Message...">
    <button onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(tab).classList.add('active');
}

// FAKE DATA
const nearbyPeople = [{id: 1, name: "Aisha", info: "Posted 5min ago", img: "https://i.pravatar.cc/60?u=aisha"}];
const onlinePeople = [{id: 2, name: "Tolu", info: "Lagos Island", img: "https://i.pravatar.cc/60?u=tolu"}];

window.onload = () => {
  onlinePeople.forEach(p => {
    document.getElementById('onlineList').innerHTML += `
      <div class="person"><img src="${p.img}"><div><h3>${p.name}</h3><p>${p.info}</p></div><button class="connect-btn" onclick="connectAndChat('${p.name}', '${p.img}')">CONNECT</button></div>
    `;
  });
}

function fakeScan() {
  document.getElementById('scanBtn').innerText = "SCANNING...";
  document.getElementById('radarWrap').style.display = 'flex';
  setTimeout(() => {
    document.getElementById('radarWrap').style.display = 'none';
    document.getElementById('nearbySection').style.display = 'block';
    nearbyPeople.forEach(p => {
      document.getElementById('nearbyList').innerHTML += `
        <div class="person"><img src="${p.img}"><div><h3>${p.name}</h3><p>${p.info}</p></div><button class="connect-btn" onclick="connectAndChat('${p.name}', '${p.img}')">CONNECT</button></div>
      `;
    });
    document.getElementById('scanBtn').innerText = "RESCAN";
  }, 2500);
}

// NEW: CONNECT = AUTO OPEN CHAT
function connectAndChat(name, img) {
  // Fake "connect" success
  document.getElementById('chatName').innerText = name;
  document.getElementById('chatImg').src = img;
  document.getElementById('chatModal').style.display = 'flex';
  
  // Add first message
  document.getElementById('chatBody').innerHTML = `<div class="msg">Hey ${name}! I saw you're at Landmark too 🔥</div>`;
}

function closeChat() {
  document.getElementById('chatModal').style.display = 'none';
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  if(input.value.trim() === '') return;
  document.getElementById('chatBody').innerHTML += `<div class="msg me">${input.value}</div>`;
  input.value = '';
  document.getElementById('chatBody').scrollTop = document.getElementById('chatBody').scrollHeight;
}
</script>
</body>
</html>
